# Defaults pre-filled in the "Add provider" form (P1-02).
# Model IDs change often: edit them here, not in the UI code.
openrouter:
  label: OpenRouter
  base_url: https://openrouter.ai/api/v1
  api_key_required: true
  default_model: openai/gpt-4o-mini
  suggested_models:
    - openai/gpt-4o-mini
    - openai/gpt-4.1-mini
    - anthropic/claude-3.5-haiku
    - google/gemini-2.0-flash-001
    - qwen/qwen-2.5-72b-instruct
  headers:
    http_referer: http://localhost:5173
    x_title: Semantic Layer AI
ollama:
  label: Ollama
  base_url: http://localhost:11434/v1
  api_key_required: false
  api_key_placeholder: ollama
  default_model: qwen2.5:7b-instruct
  suggested_models:
    - qwen2.5:7b-instruct
    - qwen2.5:14b-instruct
    - llama3.1:8b
    - mistral-nemo
openai_compatible:
  label: OpenAI-compatible
  base_url: ""
  api_key_required: false
  default_model: ""
  suggested_models: []
params:
  temperature: 0.1
  max_tokens: 4096
  timeout_s: 120
  retries: 2
